<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Football Squad</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}


/* =====================================================
   BODY
===================================================== */

body {

    min-height: 100vh;

    color: #ffffff;

    background:
        radial-gradient(
            circle at 20% 10%,
            rgba(0,255,150,0.12),
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 20%,
            rgba(0,150,255,0.12),
            transparent 30%
        ),
        #050b12;

    overflow-x: hidden;
}


/* =====================================================
   BACKGROUND EFFECT
===================================================== */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    opacity: 0.15;

    background-image:

        linear-gradient(
            rgba(255,255,255,0.04) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,0.04) 1px,
            transparent 1px
        );

    background-size: 40px 40px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent
        );
}


/* =====================================================
   HEADER
===================================================== */

.header {

    position: relative;

    text-align: center;

    padding: 45px 20px 55px;

    background:
        linear-gradient(
            135deg,
            #06140f,
            #071a28,
            #050b12
        );

    border-bottom:
        1px solid rgba(255,255,255,0.08);

    overflow: hidden;
}


/* HEADER LIGHT */

.header::before {

    content: "";

    position: absolute;

    width: 300px;
    height: 300px;

    background:
        rgba(0,255,150,0.12);

    filter: blur(80px);

    border-radius: 50%;

    top: -150px;
    left: 50%;

    transform: translateX(-50%);
}


/* =====================================================
   LOGO
===================================================== */

.team-logo {

    position: relative;

    width: 100px;
    height: 100px;

    object-fit: contain;

    margin-bottom: 15px;

    filter:
        drop-shadow(
            0 0 20px
            rgba(0,255,150,0.35)
        );
}


/* =====================================================
   TITLE
===================================================== */

.header h1 {

    position: relative;

    font-size: 34px;

    letter-spacing: 2px;

    font-weight: 800;

    margin-bottom: 10px;

    text-transform: uppercase;
}


.header p {

    position: relative;

    color: #9ca3af;

    font-size: 14px;

    letter-spacing: 1px;
}


/* =====================================================
   MAIN
===================================================== */

.container {

    position: relative;

    width: 94%;

    max-width: 1200px;

    margin: -25px auto 50px;
}


/* =====================================================
   SEARCH
===================================================== */

.search-box {

    position: relative;

    margin-bottom: 35px;
}


.search-box input {

    width: 100%;

    padding: 18px 22px 18px 50px;

    border-radius: 18px;

    border:
        1px solid
        rgba(255,255,255,0.10);

    outline: none;

    background:
        rgba(15,23,32,0.85);

    color: white;

    font-size: 16px;

    backdrop-filter: blur(15px);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,0.35);

    transition: 0.3s;
}


.search-box::before {

    content: "⌕";

    position: absolute;

    left: 20px;

    top: 50%;

    transform: translateY(-50%);

    color: #00ff9d;

    font-size: 25px;

    z-index: 2;
}


.search-box input::placeholder {

    color: #6b7280;
}


.search-box input:focus {

    border-color:
        rgba(0,255,157,0.5);

    box-shadow:
        0 0 25px
        rgba(0,255,157,0.08);
}


/* =====================================================
   PLAYER GRID
===================================================== */

.players {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(250px, 1fr)
        );

    gap: 25px;
}


/* =====================================================
   PLAYER CARD
===================================================== */

.player-card {

    position: relative;

    padding: 25px 20px 20px;

    text-align: center;

    border-radius: 24px;

    background:
        linear-gradient(
            145deg,
            rgba(20,31,42,0.95),
            rgba(7,13,20,0.95)
        );

    border:
        1px solid
        rgba(255,255,255,0.08);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,0.35);

    overflow: hidden;

    transition:
        transform 0.35s,
        box-shadow 0.35s,
        border 0.35s;
}


/* CARD TOP GLOW */

.player-card::before {

    content: "";

    position: absolute;

    width: 150px;
    height: 150px;

    background:
        rgba(0,255,157,0.10);

    filter: blur(55px);

    border-radius: 50%;

    top: -80px;
    left: 50%;

    transform:
        translateX(-50%);
}


.player-card:hover {

    transform:
        translateY(-9px);

    border-color:
        rgba(0,255,157,0.35);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,0.5),
        0 0 25px
        rgba(0,255,157,0.08);
}


/* =====================================================
   JERSEY NUMBER
===================================================== */

.jersey-bg {

    position: absolute;

    right: 12px;

    top: 5px;

    font-size: 75px;

    font-weight: 900;

    color:
        rgba(255,255,255,0.035);

    line-height: 1;

    pointer-events: none;
}


/* =====================================================
   PHOTO
===================================================== */

.photo-box {

    position: relative;

    width: 150px;

    height: 150px;

    margin:
        0 auto 18px;

    border-radius: 50%;

    padding: 5px;

    background:
        linear-gradient(
            135deg,
            #00ff9d,
            #00aaff,
            #00ff9d
        );

    box-shadow:
        0 0 25px
        rgba(0,255,157,0.18);
}


.photo-inner {

    width: 100%;
    height: 100%;

    border-radius: 50%;

    overflow: hidden;

    background: #101820;
}


.player-photo {

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}


/* =====================================================
   PLAYER NAME
===================================================== */

.player-name {

    position: relative;

    font-size: 22px;

    letter-spacing: 1px;

    font-weight: 800;

    margin-bottom: 20px;

    text-transform: uppercase;
}


/* =====================================================
   INFO
===================================================== */

.info {

    display: grid;

    grid-template-columns: 1fr;

    gap: 9px;

    position: relative;
}


.info-row {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 11px 13px;

    border-radius: 12px;

    background:
        rgba(255,255,255,0.035);

    border:
        1px solid
        rgba(255,255,255,0.05);

    font-size: 13px;
}


.info-label {

    color: #9ca3af;

    font-weight: 600;
}


.info-value {

    color: #ffffff;

    font-weight: 700;

    text-align: right;
}


/* =====================================================
   PHONE
===================================================== */

.phone-link {

    color: #00ff9d;

    text-decoration: none;

    font-weight: 700;
}


.phone-link:hover {

    text-decoration: underline;
}


/* =====================================================
   NOT FOUND
===================================================== */

.not-found {

    display: none;

    text-align: center;

    padding: 50px 20px;

    color: #6b7280;
}


/* =====================================================
   FOOTER
===================================================== */

.footer {

    text-align: center;

    padding: 25px;

    color: #6b7280;

    font-size: 13px;

    border-top:
        1px solid
        rgba(255,255,255,0.05);
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .header {

        padding:
            35px 15px 50px;
    }


    .team-logo {

        width: 80px;
        height: 80px;
    }


    .header h1 {

        font-size: 25px;

        letter-spacing: 1px;
    }


    .container {

        width: 92%;

        margin-top: -20px;
    }


    .players {

        grid-template-columns: 1fr;

        gap: 18px;
    }


    .player-card {

        max-width: 370px;

        width: 100%;

        margin: auto;
    }


    .photo-box {

        width: 140px;

        height: 140px;
    }

}


/* =====================================================
   SMALL PHONE
===================================================== */

@media (max-width: 380px) {

    .header h1 {

        font-size: 22px;
    }


    .player-card {

        padding: 20px 16px;
    }


    .photo-box {

        width: 130px;

        height: 130px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <img
        src="images/team-logo.png"
        class="team-logo"
        alt="Team Logo"
    >

    <h1>⚽ Football Squad</h1>

    <p>
        TEAM ROSTER • 14 PLAYERS
    </p>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">


    <!-- SEARCH -->

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search player name..."
        >

    </div>


    <!-- PLAYERS -->

    <div
        class="players"
        id="playersContainer">
    </div>


    <!-- NOT FOUND -->

    <div
        class="not-found"
        id="notFound">

        <h2>Player Not Found</h2>

        <p>
            Try searching another name.
        </p>

    </div>

</main>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="footer">

    © 2026 • Football Squad

</footer>



<script>

/* =====================================================
   PLAYER DATA
===================================================== */

const players = [

    {
        name: "SABBIR",
        jersey: "10",
        position: "",
        phone: "",
        photo: "images/player1.jpg"
    },

    {
        name: "SAKIB",
        jersey: "11",
        position: "",
        phone: "",
        photo: "images/player2.jpg"
    },

    {
        name: "ROMJAN",
        jersey: "9",
        position: "",
        phone: "",
        photo: "images/player3.jpg"
    },

    {
        name: "RIDUAN",
        jersey: "19",
        position: "",
        phone: "",
        photo: "images/player4.jpg"
    },

    {
        name: "AL. AMIN",
        jersey: "7",
        position: "",
        phone: "",
        photo: "images/player5.jpg"
    },

    {
        name: "RAKIB",
        jersey: "21",
        position: "",
        phone: "",
        photo: "images/player6.jpg"
    },

    {
        name: "TORIKUL",
        jersey: "3",
        position: "",
        phone: "",
        photo: "images/player7.jpg"
    },

    {
        name: "RABBI",
        jersey: "8",
        position: "",
        phone: "",
        photo: "images/player8.jpg"
    },

    {
        name: "JUNAEID",
        jersey: "22",
        position: "",
        phone: "",
        photo: "images/player9.jpg"
    },

    {
        name: "JABED",
        jersey: "5",
        position: "",
        phone: "",
        photo: "images/player10.jpg"
    },

    {
        name: "NAEIM",
        jersey: "13",
        position: "",
        phone: "",
        photo: "images/player11.jpg"
    },

    {
        name: "HASAN",
        jersey: "1",
        position: "",
        phone: "",
        photo: "images/player12.jpg"
    },

    {
        name: "PLAYER 13",
        jersey: "",
        position: "",
        phone: "",
        photo: "images/player13.jpg"
    },

    {
        name: "PLAYER 14",
        jersey: "",
        position: "",
        phone: "",
        photo: "images/player14.jpg"
    }

];


/* =====================================================
   ELEMENTS
===================================================== */

const playersContainer =
    document.getElementById(
        "playersContainer"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );

const notFound =
    document.getElementById(
        "notFound"
    );


/* =====================================================
   DISPLAY PLAYERS
===================================================== */

function displayPlayers(playerList) {

    playersContainer.innerHTML = "";


    if (playerList.length === 0) {

        notFound.style.display =
            "block";

        return;
    }


    notFound.style.display =
        "none";


    playerList.forEach(player => {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "player-card";


        card.innerHTML = `

            <!-- LARGE JERSEY NUMBER -->

            <div class="jersey-bg">

                ${player.jersey || ""}

            </div>


            <!-- PLAYER PHOTO -->

            <div class="photo-box">

                <div class="photo-inner">

                    <img
                        class="player-photo"

                        src="${player.photo}"

                        alt="${player.name}"

                        onerror="
                            this.src =
                            'images/default-player.jpg'
                        "
                    >

                </div>

            </div>


            <!-- PLAYER NAME -->

            <h2 class="player-name">

                ${player.name}

            </h2>


            <!-- INFORMATION -->

            <div class="info">


                <!-- JERSEY -->

                <div class="info-row">

                    <span class="info-label">
                        👕 Jersey
                    </span>

                    <span class="info-value">

                        ${
                            player.jersey
                            || "-"
                        }

                    </span>

                </div>


                <!-- POSITION -->

                <div class="info-row">

                    <span class="info-label">
                        ⚽ Position
                    </span>

                    <span class="info-value">

                        ${
                            player.position
                            || "-"
                        }

                    </span>

                </div>


                <!-- PHONE -->

                <div class="info-row">

                    <span class="info-label">
                        📱 Phone
                    </span>

                    <span class="info-value">

                        ${
                            player.phone

                            ?

                            `
                            <a
                                href="tel:${player.phone}"
                                class="phone-link"
                            >
                                ${player.phone}
                            </a>
                            `

                            :

                            "-"
                        }

                    </span>

                </div>


            </div>

        `;


        playersContainer.appendChild(
            card
        );

    });

}


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
    "input",
    function() {

        const searchText =
            this.value
                .toLowerCase()
                .trim();


        const filteredPlayers =
            players.filter(player =>

                player.name
                    .toLowerCase()
                    .includes(searchText)

            );


        displayPlayers(
            filteredPlayers
        );

    }
);


/* =====================================================
   INITIAL LOAD
===================================================== */

displayPlayers(players);

</script>


</body>

  </html>
