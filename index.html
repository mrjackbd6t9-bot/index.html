<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Football Team</title>


<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}


/* =========================
   BODY
========================= */

body {
    background: #eef2f7;
    color: #111827;
}


/* =========================
   HEADER
========================= */

.header {
    background: linear-gradient(
        135deg,
        #111827,
        #1d4ed8
    );

    color: white;

    text-align: center;

    padding: 30px 15px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.15);
}


.team-logo {
    width: 90px;
    height: 90px;

    object-fit: contain;

    margin-bottom: 10px;
}


.header h1 {
    font-size: 30px;

    margin-bottom: 7px;
}


.header p {
    font-size: 15px;

    opacity: 0.85;
}


/* =========================
   MAIN
========================= */

.container {
    width: 94%;

    max-width: 1150px;

    margin: 30px auto;
}


/* =========================
   SEARCH
========================= */

.search-box {
    margin-bottom: 30px;
}


.search-box input {
    width: 100%;

    padding: 16px 20px;

    border: 1px solid #d1d5db;

    border-radius: 14px;

    outline: none;

    font-size: 16px;

    background: white;

    box-shadow:
        0 4px 15px rgba(0,0,0,0.06);

    transition: 0.2s;
}


.search-box input:focus {
    border-color: #2563eb;

    box-shadow:
        0 0 0 3px rgba(37,99,235,0.12);
}


/* =========================
   PLAYER GRID
========================= */

.players {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(240px, 1fr)
        );

    gap: 22px;
}


/* =========================
   PLAYER CARD
========================= */

.player-card {

    background: white;

    border-radius: 20px;

    padding: 22px;

    text-align: center;

    box-shadow:
        0 7px 25px rgba(0,0,0,0.08);

    transition: 0.25s;

    border: 1px solid #e5e7eb;
}


.player-card:hover {

    transform:
        translateY(-6px);

    box-shadow:
        0 14px 30px rgba(0,0,0,0.13);
}


/* =========================
   PLAYER PHOTO
========================= */

.photo-box {

    width: 155px;

    height: 155px;

    margin: 0 auto 15px;

    border-radius: 50%;

    overflow: hidden;

    border: 5px solid #e5e7eb;

    background: #f3f4f6;
}


.player-photo {

    width: 100%;

    height: 100%;

    object-fit: cover;
}


/* =========================
   PLAYER NAME
========================= */

.player-name {

    font-size: 22px;

    font-weight: 700;

    margin-bottom: 16px;

    color: #111827;

    text-transform: uppercase;
}


/* =========================
   PLAYER INFORMATION
========================= */

.info {

    border-top:
        1px solid #e5e7eb;

    padding-top: 12px;

    text-align: left;
}


.info-row {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

    padding: 11px 0;

    border-bottom:
        1px solid #f1f5f9;

    font-size: 14px;
}


.info-row:last-child {

    border-bottom: none;
}


.info-label {

    font-weight: 600;

    color: #374151;

    white-space: nowrap;
}


.info-value {

    font-weight: 700;

    color: #2563eb;

    text-align: right;

    word-break: break-word;
}


/* =========================
   PHONE
========================= */

.phone-link {

    color: #2563eb;

    text-decoration: none;

    font-weight: 700;
}


.phone-link:hover {

    text-decoration: underline;
}


/* =========================
   NOT FOUND
========================= */

.not-found {

    display: none;

    text-align: center;

    margin-top: 30px;

    color: #6b7280;

    font-size: 17px;
}


/* =========================
   FOOTER
========================= */

.footer {

    text-align: center;

    padding: 25px 15px;

    margin-top: 30px;

    color: #6b7280;

    font-size: 14px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .header {
        padding: 25px 12px;
    }


    .team-logo {
        width: 75px;
        height: 75px;
    }


    .header h1 {
        font-size: 24px;
    }


    .container {
        width: 92%;
        margin: 22px auto;
    }


    .players {
        grid-template-columns: 1fr;

        gap: 18px;
    }


    .player-card {

        max-width: 360px;

        width: 100%;

        margin: auto;

        padding: 20px;
    }


    .photo-box {

        width: 140px;

        height: 140px;
    }


    .player-name {

        font-size: 20px;
    }

}


/* =========================
   SMALL PHONE
========================= */

@media (max-width: 380px) {

    .player-card {
        padding: 17px;
    }


    .photo-box {

        width: 125px;

        height: 125px;
    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <img
        src="images/team-logo.png"
        class="team-logo"
        alt="Team Logo"
    >

    <h1>⚽ FOOTBALL TEAM</h1>

    <p>
        Total Players: 14
    </p>

</header>



<!-- =========================
     MAIN
========================= -->

<main class="container">


    <!-- SEARCH -->

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="🔎 Search player name..."
        >

    </div>



    <!-- PLAYER CARDS -->

    <div
        class="players"
        id="playersContainer">
    </div>



    <!-- NOT FOUND -->

    <div
        class="not-found"
        id="notFound">

        Player not found.

    </div>


</main>



<!-- =========================
     FOOTER
========================= -->

<footer class="footer">

    © 2026 Football Team

</footer>



<script>

/* =========================================
   PLAYER DATA
========================================= */

const players = [

    {
        name: "SABBIR",
        jersey: "10",
        position: "",
        phone: "",
        photo: "images/player1.jpg"
    },

    {
        name: "SAKIB",
        jersey: "11",
        position: "",
        phone: "",
        photo: "images/player2.jpg"
    },

    {
        name: "ROMJAN",
        jersey: "9",
        position: "",
        phone: "",
        photo: "images/player3.jpg"
    },

    {
        name: "RIDUAN",
        jersey: "19",
        position: "",
        phone: "",
        photo: "images/player4.jpg"
    },

    {
        name: "AL. AMIN",
        jersey: "7",
        position: "",
        phone: "",
        photo: "images/player5.jpg"
    },

    {
        name: "RAKIB",
        jersey: "21",
        position: "",
        phone: "",
        photo: "images/player6.jpg"
    },

    {
        name: "TORIKUL",
        jersey: "3",
        position: "",
        phone: "",
        photo: "images/player7.jpg"
    },

    {
        name: "RABBI",
        jersey: "8",
        position: "",
        phone: "",
        photo: "images/player8.jpg"
    },

    {
        name: "JUNAEID",
        jersey: "22",
        position: "",
        phone: "",
        photo: "images/player9.jpg"
    },

    {
        name: "JABED",
        jersey: "5",
        position: "",
        phone: "",
        photo: "images/player10.jpg"
    },

    {
        name: "NAEIM",
        jersey: "13",
        position: "",
        phone: "",
        photo: "images/player11.jpg"
    },

    {
        name: "HASAN",
        jersey: "1",
        position: "",
        phone: "",
        photo: "images/player12.jpg"
    },

    {
        name: "PLAYER 13",
        jersey: "",
        position: "",
        phone: "",
        photo: "images/player13.jpg"
    },

    {
        name: "PLAYER 14",
        jersey: "",
        position: "",
        phone: "",
        photo: "images/player14.jpg"
    }

];


/* =========================================
   HTML ELEMENTS
========================================= */

const playersContainer =
    document.getElementById(
        "playersContainer"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const notFound =
    document.getElementById(
        "notFound"
    );


/* =========================================
   DISPLAY PLAYERS
========================================= */

function displayPlayers(playerList) {

    playersContainer.innerHTML = "";


    if (playerList.length === 0) {

        notFound.style.display =
            "block";

        return;
    }


    notFound.style.display =
        "none";


    playerList.forEach(player => {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "player-card";


        card.innerHTML = `

            <!-- PLAYER PHOTO -->

            <div class="photo-box">

                <img
                    class="player-photo"
                    src="${player.photo}"
                    alt="${player.name}"

                    onerror="
                        this.src='images/default-player.jpg'
                    "
                >

            </div>


            <!-- PLAYER NAME -->

            <h2 class="player-name">

                ${player.name}

            </h2>


            <!-- PLAYER INFORMATION -->

            <div class="info">


                <!-- JERSEY -->

                <div class="info-row">

                    <span class="info-label">
                        👕 Jersey Number
                    </span>

                    <span class="info-value">

                        ${
                            player.jersey
                            || "-"
                        }

                    </span>

                </div>


                <!-- POSITION -->

                <div class="info-row">

                    <span class="info-label">
                        ⚽ Position
                    </span>

                    <span class="info-value">

                        ${
                            player.position
                            || "-"
                        }

                    </span>

                </div>


                <!-- PHONE -->

                <div class="info-row">

                    <span class="info-label">
                        📱 Phone
                    </span>

                    <span class="info-value">

                        ${
                            player.phone

                            ? `
                                <a
                                    class="phone-link"
                                    href="tel:${player.phone}"
                                >
                                    ${player.phone}
                                </a>
                            `

                            : "-"
                        }

                    </span>

                </div>


            </div>

        `;


        playersContainer.appendChild(
            card
        );

    });

}


/* =========================================
   SEARCH
========================================= */

searchInput.addEventListener(
    "input",
    function() {

        const searchText =
            this.value
                .toLowerCase()
                .trim();


        const filteredPlayers =
            players.filter(player =>

                player.name
                    .toLowerCase()
                    .includes(searchText)

            );


        displayPlayers(
            filteredPlayers
        );

    }
);


/* =========================================
   LOAD PLAYERS
========================================= */

displayPlayers(players);

</script>


</body>

  </html>
