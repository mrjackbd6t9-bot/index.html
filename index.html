<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Football Squad</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}


/* =====================================================
   BODY
===================================================== */

body {

    min-height: 100vh;

    color: #ffffff;

    background:
        radial-gradient(
            circle at 20% 10%,
            rgba(212,175,55,0.10),
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 20%,
            rgba(255,193,7,0.07),
            transparent 30%
        ),
        #080808;

    overflow-x: hidden;
}


/* =====================================================
   BACKGROUND GRID
===================================================== */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    opacity: 0.12;

    background-image:

        linear-gradient(
            rgba(212,175,55,0.06) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(212,175,55,0.06) 1px,
            transparent 1px
        );

    background-size: 40px 40px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent
        );
}


/* =====================================================
   HEADER
===================================================== */

.header {

    position: relative;

    text-align: center;

    padding: 45px 20px 55px;

    background:
        linear-gradient(
            135deg,
            #050505,
            #11100d,
            #050505
        );

    border-bottom:
        1px solid
        rgba(212,175,55,0.25);

    overflow: hidden;
}


/* HEADER GOLDEN LIGHT */

.header::before {

    content: "";

    position: absolute;

    width: 320px;
    height: 320px;

    background:
        rgba(212,175,55,0.10);

    filter: blur(90px);

    border-radius: 50%;

    top: -170px;

    left: 50%;

    transform: translateX(-50%);
}


/* =====================================================
   TEAM LOGO
===================================================== */

.team-logo {

    position: relative;

    width: 105px;
    height: 105px;

    object-fit: contain;

    margin-bottom: 15px;

    filter:
        drop-shadow(
            0 0 18px
            rgba(212,175,55,0.35)
        );
}


/* =====================================================
   TITLE
===================================================== */

.header h1 {

    position: relative;

    font-size: 34px;

    letter-spacing: 3px;

    font-weight: 900;

    margin-bottom: 10px;

    text-transform: uppercase;

    color: #ffffff;
}


/* GOLDEN WORD EFFECT */

.header h1::first-letter {

    color: #d4af37;
}


.header p {

    position: relative;

    color: #a8a8a8;

    font-size: 14px;

    letter-spacing: 2px;
}


/* =====================================================
   MAIN CONTAINER
===================================================== */

.container {

    position: relative;

    width: 94%;

    max-width: 1200px;

    margin: -25px auto 50px;
}


/* =====================================================
   SEARCH BOX
===================================================== */

.search-box {

    position: relative;

    margin-bottom: 35px;
}


.search-box input {

    width: 100%;

    padding:
        18px
        22px
        18px
        52px;

    border-radius: 16px;

    border:
        1px solid
        rgba(212,175,55,0.25);

    outline: none;

    background:
        #111111;

    color: #ffffff;

    font-size: 16px;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,0.5);

    transition: 0.3s;
}


.search-box::before {

    content: "⌕";

    position: absolute;

    left: 20px;

    top: 50%;

    transform:
        translateY(-50%);

    color: #d4af37;

    font-size: 25px;

    z-index: 2;
}


.search-box input::placeholder {

    color: #666666;
}


.search-box input:focus {

    border-color:
        #d4af37;

    box-shadow:
        0 0 25px
        rgba(212,175,55,0.12);
}


/* =====================================================
   PLAYER GRID
===================================================== */

.players {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(250px, 1fr)
        );

    gap: 25px;
}


/* =====================================================
   PLAYER CARD
===================================================== */

.player-card {

    position: relative;

    padding:
        25px
        20px
        20px;

    text-align: center;

    border-radius: 22px;

    background:
        linear-gradient(
            145deg,
            #171717,
            #0c0c0c
        );

    border:
        1px solid
        rgba(212,175,55,0.22);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,0.65);

    overflow: hidden;

    transition:
        transform 0.35s,
        box-shadow 0.35s,
        border 0.35s;
}


/* CARD TOP GOLDEN LINE */

.player-card::after {

    content: "";

    position: absolute;

    top: 0;
    left: 8%;

    width: 84%;

    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #d4af37,
            #f5d76e,
            #d4af37,
            transparent
        );

    opacity: 0.75;
}


/* CARD GOLDEN GLOW */

.player-card::before {

    content: "";

    position: absolute;

    width: 170px;
    height: 170px;

    background:
        rgba(212,175,55,0.07);

    filter: blur(65px);

    border-radius: 50%;

    top: -100px;

    left: 50%;

    transform:
        translateX(-50%);

    pointer-events: none;
}


/* =====================================================
   CARD HOVER
===================================================== */

.player-card:hover {

    transform:
        translateY(-9px);

    border-color:
        rgba(212,175,55,0.65);

    box-shadow:
        0 20px 55px
        rgba(0,0,0,0.8),

        0 0 30px
        rgba(212,175,55,0.10);
}


/* =====================================================
   JERSEY BACKGROUND NUMBER
===================================================== */

.jersey-bg {

    position: absolute;

    right: 12px;

    top: 5px;

    font-size: 75px;

    font-weight: 900;

    color:
        rgba(212,175,55,0.055);

    line-height: 1;

    pointer-events: none;
}


/* =====================================================
   PLAYER PHOTO
===================================================== */

.photo-box {

    position: relative;

    width: 150px;

    height: 150px;

    margin:
        0 auto 18px;

    border-radius: 50%;

    padding: 5px;

    background:
        linear-gradient(
            135deg,
            #8a6a19,
            #d4af37,
            #f5d76e,
            #b8860b,
            #d4af37
        );

    box-shadow:
        0 0 25px
        rgba(212,175,55,0.18);
}


/* =====================================================
   PHOTO INNER
===================================================== */

.photo-inner {

    width: 100%;
    height: 100%;

    border-radius: 50%;

    overflow: hidden;

    background:
        #101010;

    border:
        3px solid
        #0a0a0a;
}


/* =====================================================
   PLAYER PHOTO
===================================================== */

.player-photo {

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}


/* =====================================================
   PLAYER NAME
===================================================== */

.player-name {

    position: relative;

    font-size: 22px;

    letter-spacing: 1px;

    font-weight: 800;

    margin-bottom: 8px;

    text-transform: uppercase;

    color: #ffffff;
}


/* =====================================================
   PLAYER ID
===================================================== */

.player-id {

    position: relative;

    display: inline-block;

    color: #d4af37;

    font-size: 13px;

    font-weight: 800;

    letter-spacing: 1px;

    margin-bottom: 18px;

    padding:
        6px
        11px;

    border-radius: 7px;

    background:
        rgba(212,175,55,0.07);

    border:
        1px solid
        rgba(212,175,55,0.28);

    box-shadow:
        inset 0 0 12px
        rgba(212,175,55,0.03);
}


/* =====================================================
   INFORMATION
===================================================== */

.info {

    display: grid;

    grid-template-columns: 1fr;

    gap: 9px;

    position: relative;
}


/* =====================================================
   INFO ROW
===================================================== */

.info-row {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding:
        11px
        13px;

    border-radius: 11px;

    background:
        #111111;

    border:
        1px solid
        rgba(212,175,55,0.10);

    font-size: 13px;

    transition: 0.25s;
}


.info-row:hover {

    border-color:
        rgba(212,175,55,0.28);

    background:
        #151515;
}


/* =====================================================
   INFO LABEL
===================================================== */

.info-label {

    color: #8e8e8e;

    font-weight: 600;
}


/* =====================================================
   INFO VALUE
===================================================== */

.info-value {

    color: #eeeeee;

    font-weight: 700;

    text-align: right;
}


/* =====================================================
   PHONE
===================================================== */

.phone-link {

    color: #d4af37;

    text-decoration: none;

    font-weight: 700;
}


.phone-link:hover {

    color: #f5d76e;

    text-decoration: underline;
}


/* =====================================================
   NOT FOUND
===================================================== */

.not-found {

    display: none;

    text-align: center;

    padding:
        50px
        20px;

    color: #777777;
}


.not-found h2 {

    color: #d4af37;

    margin-bottom: 8px;
}


/* =====================================================
   FOOTER
===================================================== */

.footer {

    text-align: center;

    padding: 25px;

    color: #666666;

    font-size: 13px;

    border-top:
        1px solid
        rgba(212,175,55,0.12);

    background:
        #060606;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .header {

        padding:
            35px
            15px
            50px;
    }


    .team-logo {

        width: 85px;
        height: 85px;
    }


    .header h1 {

        font-size: 25px;

        letter-spacing: 2px;
    }


    .container {

        width: 92%;

        margin-top: -20px;
    }


    .players {

        grid-template-columns: 1fr;

        gap: 18px;
    }


    .player-card {

        max-width: 370px;

        width: 100%;

        margin: auto;
    }


    .photo-box {

        width: 140px;

        height: 140px;
    }

}


/* =====================================================
   SMALL PHONE
===================================================== */

@media (max-width: 380px) {

    .header h1 {

        font-size: 22px;
    }


    .player-card {

        padding:
            20px
            16px;
    }


    .photo-box {

        width: 130px;

        height: 130px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <img
        src="file_000000005bf881faadb80aa13a35e528.png"
        class="team-logo"
        alt="Team Logo"
    >

    <h1>⚽ Football Squad</h1>

    <p>
        TEAM ROSTER • 14 PLAYERS
    </p>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">


    <!-- SEARCH -->

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search player name or ID..."
        >

    </div>


    <!-- PLAYERS -->

    <div
        class="players"
        id="playersContainer">
    </div>


    <!-- NOT FOUND -->

    <div
        class="not-found"
        id="notFound">

        <h2>Player Not Found</h2>

        <p>
            Try searching another name or ID.
        </p>

    </div>

</main>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="footer">

    © 2026 • Football Squad

</footer>



<script>

/* =====================================================
   PLAYER DATA
===================================================== */

const players = [

    {
        id: "1001",
        name: "SABBIR",
        jersey: "10",
        position: "",
        phone: "",
        photo: "IMG-20260902-WA0010.jpg"
    },

    {
        id: "1002",
        name: "SAKIB",
        jersey: "11",
        position: "",
        phone: "",
        photo: "IMG-20260902-WA0006.jpg"
    },

    {
        id: "1003",
        name: "ROMJAN",
        jersey: "9",
        position: "",
        phone: "",
        photo: "images/player3.jpg"
    },

    {
        id: "1004",
        name: "RIDUAN",
        jersey: "19",
        position: "",
        phone: "",
        photo: "images/player4.jpg"
    },

    {
        id: "1005",
        name: "AL. AMIN",
        jersey: "7",
        position: "",
        phone: "",
        photo: "images/player5.jpg"
    },

    {
        id: "1006",
        name: "RAKIB",
        jersey: "21",
        position: "",
        phone: "",
        photo: "images/player6.jpg"
    },

    {
        id: "1007",
        name: "TORIKUL",
        jersey: "3",
        position: "",
        phone: "",
        photo: "images/player7.jpg"
    },

    {
        id: "1008",
        name: "RABBI",
        jersey: "8",
        position: "",
        phone: "",
        photo: "images/player8.jpg"
    },

    {
        id: "1009",
        name: "JUNAEID",
        jersey: "22",
        position: "",
        phone: "",
        photo: "images/player9.jpg"
    },

    {
        id: "1010",
        name: "JABED",
        jersey: "5",
        position: "",
        phone: "",
        photo: "images/player10.jpg"
    },

    {
        id: "1011",
        name: "NAEIM",
        jersey: "13",
        position: "",
        phone: "",
        photo: "images/player11.jpg"
    },

    {
        id: "1012",
        name: "HASAN",
        jersey: "1",
        position: "",
        phone: "",
        photo: "images/player12.jpg"
    },

    {
        id: "1013",
        name: "PLAYER 13",
        jersey: "",
        position: "",
        phone: "",
        photo: "images/player13.jpg"
    },

    {
        id: "1014",
        name: "PLAYER 14",
        jersey: "",
        position: "",
        phone: "",
        photo: "images/player14.jpg"
    }

];


/* =====================================================
   ELEMENTS
===================================================== */

const playersContainer =
    document.getElementById(
        "playersContainer"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );

const notFound =
    document.getElementById(
        "notFound"
    );


/* =====================================================
   DISPLAY PLAYERS
===================================================== */

function displayPlayers(playerList) {

    playersContainer.innerHTML = "";


    if (playerList.length === 0) {

        notFound.style.display =
            "block";

        return;
    }


    notFound.style.display =
        "none";


    playerList.forEach(player => {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "player-card";


        card.innerHTML = `

            <!-- JERSEY BACKGROUND -->

            <div class="jersey-bg">
                ${player.jersey || ""}
            </div>


            <!-- PLAYER PHOTO -->

            <div class="photo-box">

                <div class="photo-inner">

                    <img
                        class="player-photo"

                        src="${player.photo}"

                        alt="${player.name}"

                        onerror="
                            this.src =
                            'images/default-player.jpg'
                        "
                    >

                </div>

            </div>


            <!-- PLAYER NAME -->

            <h2 class="player-name">
                ${player.name}
            </h2>


            <!-- PLAYER ID -->

            <div class="player-id">
                ID: ${player.id}
            </div>


            <!-- INFORMATION -->

            <div class="info">


                <!-- JERSEY -->

                <div class="info-row">

                    <span class="info-label">
                        👕 Jersey
                    </span>

                    <span class="info-value">
                        ${player.jersey || "-"}
                    </span>

                </div>


                <!-- POSITION -->

                <div class="info-row">

                    <span class="info-label">
                        ⚽ Position
                    </span>

                    <span class="info-value">
                        ${player.position || "-"}
                    </span>

                </div>


                <!-- PHONE -->

                <div class="info-row">

                    <span class="info-label">
                        📱 Phone
                    </span>

                    <span class="info-value">

                        ${
                            player.phone
                            ?

                            `
                            <a
                                href="tel:${player.phone}"
                                class="phone-link"
                            >
                                ${player.phone}
                            </a>
                            `

                            :

                            "-"
                        }

                    </span>

                </div>


            </div>

        `;


        playersContainer.appendChild(
            card
        );

    });

}


/* =====================================================
   SEARCH BY NAME OR ID
===================================================== */

searchInput.addEventListener(
    "input",
    function() {

        const searchText =
            this.value
                .toLowerCase()
                .trim();


        const filteredPlayers =
            players.filter(player =>

                player.name
                    .toLowerCase()
                    .includes(searchText)

                ||

                player.id
                    .toLowerCase()
                    .includes(searchText)

            );


        displayPlayers(
            filteredPlayers
        );

    }
);


/* =====================================================
   INITIAL LOAD
===================================================== */

displayPlayers(players);

</script>


</body>

</html>
